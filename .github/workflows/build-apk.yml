name: Compilar APK Matibatidos POS

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localizar proyecto Android
        id: project
        shell: bash
        run: |
          GRADLE_FILE=$(find . -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No se encontró gradlew."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Proyecto encontrado: $PROJECT_DIR"

      - name: Actualizar archivo HTML del POS
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"
          HTML=$(find . -maxdepth 2 \
            -name 'Matibatidos_POS_RC6_Acode_v24.html' \
            -not -path './.git/*' | head -n 1)

          if [ -n "$HTML" ]; then
            mkdir -p "$PROJECT/app/src/main/assets"
            cp "$HTML" "$PROJECT/app/src/main/assets/index.html"
            echo "HTML actualizado correctamente."
          else
            echo "No se encontró el HTML RC6."
            exit 1
          fi

      - name: Dar permisos a Gradle
        run: chmod +x "${{ steps.project.outputs.dir }}/gradlew"

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
